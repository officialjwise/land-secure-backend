<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Secure - Real-time Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .connection-status {
            background: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.connected {
            background: #28a745;
        }

        .status-indicator.disconnected {
            background: #dc3545;
        }

        .main-content {
            display: flex;
            min-height: 600px;
        }

        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
            padding: 20px;
        }

        .chat-list {
            margin-bottom: 20px;
        }

        .chat-list h3 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 1.2em;
        }

        .chat-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .chat-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .chat-item.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .chat-item h4 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1em;
        }

        .chat-item p {
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .chat-item .unread {
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .online-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .online-indicator.online {
            background: #28a745;
        }

        .online-indicator.offline {
            background: #6c757d;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .chat-header h3 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .chat-header p {
            color: #6c757d;
            font-size: 0.9em;
        }

        .typing-indicator {
            color: #6c757d;
            font-style: italic;
            font-size: 0.9em;
            padding: 5px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        .message.sent .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-content {
            background: white;
            color: #2c3e50;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }

        .message-info {
            font-size: 0.8em;
            margin-top: 5px;
            opacity: 0.7;
        }

        .message-status {
            font-size: 0.7em;
            margin-top: 3px;
            opacity: 0.6;
        }

        .message-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .message-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e9ecef;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .message-input input:focus {
            border-color: #667eea;
        }

        .send-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
        }

        .send-btn:hover {
            background: #5a6fd8;
        }

        .send-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .new-chat-section {
            margin-bottom: 20px;
        }

        .new-chat-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
            transition: background 0.3s ease;
        }

        .new-chat-btn:hover {
            background: #218838;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            width: 100%;
        }

        .submit-btn:hover {
            background: #5a6fd8;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots::after {
            content: '';
            animation: typing 1.5s infinite;
        }

        @keyframes typing {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Land Secure - Real-time Chat</h1>
            <p>Connect with property owners and potential buyers</p>
        </div>

        <div class="connection-status">
            <div>
                <span class="status-indicator disconnected" id="statusIndicator"></span>
                <span id="statusText">Disconnected</span>
            </div>
            <div>
                <span id="onlineUsers">0</span> users online
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="new-chat-section">
                    <button class="new-chat-btn" onclick="openNewChatModal()">+ New Chat</button>
                </div>
                
                <div class="chat-list">
                    <h3>Your Conversations</h3>
                    <div id="chatList">
                        <div class="loading">Loading chats...</div>
                    </div>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-header">
                    <h3 id="currentChatTitle">Select a chat to start messaging</h3>
                    <p id="currentChatSubtitle">Choose from your conversations on the left</p>
                </div>

                <div class="typing-indicator" id="typingIndicator" style="display: none;">
                    <span id="typingText"></span>
                </div>

                <div class="messages" id="messages">
                    <div class="loading">Select a chat to view messages</div>
                </div>

                <div class="message-input">
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="messageInput" 
                            placeholder="Type your message..." 
                            disabled
                        >
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat Modal -->
    <div id="newChatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Start New Chat</h2>
                <span class="close" onclick="closeNewChatModal()">&times;</span>
            </div>
            <form id="newChatForm">
                <div class="form-group">
                    <label for="propertyId">Property ID:</label>
                    <input type="text" id="propertyId" required>
                </div>
                <div class="form-group">
                    <label for="sellerId">Seller ID:</label>
                    <input type="text" id="sellerId" required>
                </div>
                <div class="form-group">
                    <label for="propertyTitle">Property Title:</label>
                    <input type="text" id="propertyTitle" required>
                </div>
                <button type="submit" class="submit-btn">Create Chat</button>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:3001';
        const WS_URL = 'http://localhost:3001/chat';
        let currentChatId = null;
        let currentUser = null;
        let socket = null;
        let typingTimeout = null;
        let isTyping = false;

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in
            const token = localStorage.getItem('jwt_token');
            if (!token) {
                alert('Please log in to use the chat system');
                return;
            }

            // Initialize WebSocket connection
            initializeWebSocket();
            
            // Load user's chats
            loadChats();
            
            // Set up form submission
            document.getElementById('newChatForm').addEventListener('submit', createNewChat);
            
            // Set up typing detection
            setupTypingDetection();
        });

        // Initialize WebSocket connection
        function initializeWebSocket() {
            const token = localStorage.getItem('jwt_token');
            
            socket = io(WS_URL, {
                auth: {
                    token: token
                },
                transports: ['websocket', 'polling']
            });

            // Connection events
            socket.on('connect', () => {
                updateConnectionStatus(true);
                console.log('Connected to WebSocket server');
            });

            socket.on('disconnect', () => {
                updateConnectionStatus(false);
                console.log('Disconnected from WebSocket server');
            });

            socket.on('connect_error', (error) => {
                console.error('WebSocket connection error:', error);
                updateConnectionStatus(false);
            });

            // Chat events
            socket.on('newMessage', (data) => {
                handleNewMessage(data);
            });

            socket.on('messageSent', (data) => {
                handleMessageSent(data);
            });

            socket.on('userTyping', (data) => {
                handleUserTyping(data);
            });

            socket.on('userJoinedChat', (data) => {
                handleUserJoinedChat(data);
            });

            socket.on('userLeftChat', (data) => {
                handleUserLeftChat(data);
            });

            socket.on('messagesRead', (data) => {
                handleMessagesRead(data);
            });

            socket.on('unreadCountUpdated', (data) => {
                handleUnreadCountUpdated(data);
            });

            socket.on('error', (data) => {
                console.error('WebSocket error:', data);
                showStatus(data.message || 'An error occurred', 'error');
            });
        }

        // Update connection status UI
        function updateConnectionStatus(connected) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                indicator.className = 'status-indicator connected';
                statusText.textContent = 'Connected';
            } else {
                indicator.className = 'status-indicator disconnected';
                statusText.textContent = 'Disconnected';
            }
        }

        // Setup typing detection
        function setupTypingDetection() {
            const input = document.getElementById('messageInput');
            
            input.addEventListener('input', () => {
                if (!currentChatId) return;
                
                if (!isTyping) {
                    isTyping = true;
                    socket.emit('typing', { chatId: currentChatId, isTyping: true });
                }
                
                // Clear existing timeout
                if (typingTimeout) {
                    clearTimeout(typingTimeout);
                }
                
                // Set new timeout
                typingTimeout = setTimeout(() => {
                    isTyping = false;
                    socket.emit('typing', { chatId: currentChatId, isTyping: false });
                }, 1000);
            });
        }

        // Handle new message from WebSocket
        function handleNewMessage(data) {
            if (data.chatId === currentChatId) {
                // Add message to current chat
                addMessageToUI(data.message, false);
                
                // Mark as read if this is the current chat
                socket.emit('markAsRead', { chatId: currentChatId });
            }
            
            // Update chat list to show new message
            loadChats();
        }

        // Handle message sent confirmation
        function handleMessageSent(data) {
            console.log('Message sent successfully:', data);
        }

        // Handle typing indicator
        function handleUserTyping(data) {
            if (data.chatId === currentChatId) {
                const typingIndicator = document.getElementById('typingIndicator');
                const typingText = document.getElementById('typingText');
                
                if (data.isTyping) {
                    typingText.textContent = `${data.userName} is typing`;
                    typingIndicator.style.display = 'block';
                } else {
                    typingIndicator.style.display = 'none';
                }
            }
        }

        // Handle user joined chat
        function handleUserJoinedChat(data) {
            if (data.chatId === currentChatId) {
                showStatus(`${data.userName} joined the chat`, 'success');
            }
        }

        // Handle user left chat
        function handleUserLeftChat(data) {
            if (data.chatId === currentChatId) {
                showStatus(`${data.userName} left the chat`, 'error');
            }
        }

        // Handle messages read
        function handleMessagesRead(data) {
            if (data.chatId === currentChatId) {
                // Update message read status in UI
                updateMessageReadStatus();
            }
        }

        // Handle unread count update
        function handleUnreadCountUpdated(data) {
            // Update chat list to reflect new unread counts
            loadChats();
        }

        // Load user's chats
        async function loadChats() {
            try {
                const response = await fetch(`${API_BASE_URL}/chats`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load chats');
                }

                const chats = await response.json();
                displayChats(chats);
            } catch (error) {
                console.error('Error loading chats:', error);
                document.getElementById('chatList').innerHTML = 
                    '<div class="status error">Failed to load chats. Please try again.</div>';
            }
        }

        // Display chats in sidebar
        function displayChats(chats) {
            const chatList = document.getElementById('chatList');
            
            if (chats.length === 0) {
                chatList.innerHTML = '<div class="status">No chats yet. Start a new conversation!</div>';
                return;
            }

            chatList.innerHTML = chats.map(chat => `
                <div class="chat-item" onclick="selectChat('${chat.id}')" data-chat-id="${chat.id}">
                    <h4>${chat.property_title}</h4>
                    <p>${chat.buyer_name} ↔ ${chat.seller_name}</p>
                    <p style="font-size: 0.8em; color: #999;">
                        ${new Date(chat.last_message_at).toLocaleDateString()}
                    </p>
                    ${chat.unread_count > 0 ? `<span class="unread">${chat.unread_count}</span>` : ''}
                </div>
            `).join('');
        }

        // Select a chat
        async function selectChat(chatId) {
            currentChatId = chatId;
            
            // Update UI
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-chat-id="${chatId}"]`).classList.add('active');
            
            // Enable message input
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            
            // Join chat room via WebSocket
            socket.emit('joinChat', { chatId: chatId });
            
            // Load chat messages
            await loadChatMessages(chatId);
        }

        // Load chat messages
        async function loadChatMessages(chatId) {
            try {
                const response = await fetch(`${API_BASE_URL}/chats/${chatId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load messages');
                }

                const chat = await response.json();
                displayMessages(chat);
                updateChatHeader(chat);
            } catch (error) {
                console.error('Error loading messages:', error);
                document.getElementById('messages').innerHTML = 
                    '<div class="status error">Failed to load messages. Please try again.</div>';
            }
        }

        // Display messages
        function displayMessages(chat) {
            const messagesDiv = document.getElementById('messages');
            
            if (chat.messages.length === 0) {
                messagesDiv.innerHTML = '<div class="status">No messages yet. Start the conversation!</div>';
                return;
            }

            messagesDiv.innerHTML = chat.messages.map(message => `
                <div class="message ${message.sender_role === 'buyer' ? 'sent' : 'received'}">
                    <div class="message-content">
                        <div>${message.content}</div>
                        <div class="message-info">
                            ${message.sender_name} • ${new Date(message.created_at).toLocaleString()}
                        </div>
                        <div class="message-status">
                            ${message.is_read ? '✓ Read' : '✓ Sent'}
                        </div>
                    </div>
                </div>
            `).join('');

            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Update chat header
        function updateChatHeader(chat) {
            document.getElementById('currentChatTitle').textContent = chat.property_title;
            document.getElementById('currentChatSubtitle').textContent = 
                `${chat.buyer_name} ↔ ${chat.seller_name}`;
        }

        // Send message via WebSocket
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !currentChatId) return;

            // Send message via WebSocket
            socket.emit('sendMessage', {
                chat_id: currentChatId,
                content: content,
                message_type: 'text'
            });

            // Clear input
            input.value = '';
            
            // Add message to UI immediately (optimistic update)
            const tempMessage = {
                id: 'temp-' + Date.now(),
                content: content,
                sender_name: 'You',
                sender_role: 'buyer',
                created_at: new Date(),
                is_read: false
            };
            
            addMessageToUI(tempMessage, true);
        }

        // Add message to UI
        function addMessageToUI(message, isSent) {
            const messagesDiv = document.getElementById('messages');
            
            const messageElement = document.createElement('div');
            messageElement.className = `message ${isSent ? 'sent' : 'received'}`;
            messageElement.innerHTML = `
                <div class="message-content">
                    <div>${message.content}</div>
                    <div class="message-info">
                        ${message.sender_name} • ${new Date(message.created_at).toLocaleString()}
                    </div>
                    <div class="message-status">
                        ${message.is_read ? '✓ Read' : '✓ Sent'}
                    </div>
                </div>
            `;
            
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Update message read status
        function updateMessageReadStatus() {
            const messages = document.querySelectorAll('.message.received .message-status');
            messages.forEach(status => {
                status.textContent = '✓ Read';
            });
        }

        // Handle Enter key in message input
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // New chat modal functions
        function openNewChatModal() {
            document.getElementById('newChatModal').style.display = 'block';
        }

        function closeNewChatModal() {
            document.getElementById('newChatModal').style.display = 'none';
        }

        // Create new chat
        async function createNewChat(e) {
            e.preventDefault();
            
            const formData = {
                property_id: document.getElementById('propertyId').value,
                seller_id: document.getElementById('sellerId').value,
                property_title: document.getElementById('propertyTitle').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/chats`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('Failed to create chat');
                }

                const chat = await response.json();
                
                // Close modal and reset form
                closeNewChatModal();
                document.getElementById('newChatForm').reset();
                
                // Reload chats and select the new one
                await loadChats();
                await selectChat(chat.id);
                
                // Show success message
                showStatus('Chat created successfully!', 'success');
                
            } catch (error) {
                console.error('Error creating chat:', error);
                showStatus('Failed to create chat. Please try again.', 'error');
            }
        }

        // Show status message
        function showStatus(message, type) {
            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            
            document.querySelector('.container').insertBefore(statusDiv, document.querySelector('.main-content'));
            
            setTimeout(() => {
                statusDiv.remove();
            }, 3000);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('newChatModal');
            if (event.target === modal) {
                closeNewChatModal();
            }
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (socket) {
                socket.disconnect();
            }
        });
    </script>
</body>
</html>
